syntax = "proto3";

package proxy_proto;

// The greeting service definition.
service proxyService {
  // Sends a greeting
  rpc checkalive (CheckaliveCMD) returns (RequestResult);

  // encode and set
  rpc encodeAndSetObject(ObjectAndPlacement) returns (SetReply);
  // get and decode
  rpc decodeAndGetObject(ObjectAndPlacement) returns (GetReply);
  // degraded read
  rpc degradedRead(DegradedReadRequest) returns (DegradedReadReply);
  rpc degradedRead2Client(RecoveryRequest) returns (DegradedReadReply);
  rpc degradedReadBreakdown(DegradedReadRequest) returns (DegradedReadReply);
  rpc degradedRead2ClientBreakdown(RecoveryRequest) returns (DegradedReadReply);
  rpc degradedReadWithBlockStripeID(DegradedReadRequest) returns (GetReply);
  rpc partialDecoding(PartialDecodingRequest) returns (DegradedReadReply);
  // recovery
  rpc recovery(RecoveryRequest) returns (RecoveryReply);
  rpc recoveryBreakdown(RecoveryRequest) returns (RecoveryReply);
  rpc multipleRecovery(MultipleRecoveryRequest) returns (GetReply);
  // delete
  rpc deleteBlock(NodeAndBlock) returns (DelReply);
  // append
  rpc scheduleAppend2Datanode(AppendStripeDataPlacement) returns (SetReply);
  // get stripe
  rpc getBlocks(StripeAndBlockIDs) returns (GetReply);
}

// parity block recalculation
message locationInfo {
  int32 cluster_id = 1;
  string proxy_ip = 2;
  int32 proxy_port = 3;
  repeated string datanodeip = 4;
  repeated int32 datanodeport = 5;
  repeated string blockkeys = 6;
  repeated int32 blockids = 7;
}

message mainRecalPlan {
  bool type = 1;  // to distinguish local and global
  bool if_partial_decoding = 2;
  repeated locationInfo clusters = 3;
  repeated string p_datanodeip = 4;
  repeated int32 p_datanodeport = 5;
  repeated string p_blockkeys = 6;
  int32 k = 7;
  int32 l = 8;
  int32 g_m = 9;
  int32 block_size = 10;
  int32 encodetype = 11;
  int32 stripe_id = 12;
  int32 group_id = 13;
}

message RecalReply {
  string result = 1;
}

message helpRecalPlan {
  bool type = 1;
  bool if_partial_decoding = 2;
  string mainproxyip = 3;
  int32 mainproxyport = 4;
  repeated string datanodeip = 5;
  repeated int32 datanodeport = 6;
  repeated string blockkeys = 7;
  int32 block_size = 8;
  repeated int32 blockids = 9;
  int32 parity_num = 10;
  int32 k = 11;
  int32 encodetype = 12;
}

// block relocation
message blockRelocPlan {
  repeated string blocktomove = 1;
  repeated string fromdatanodeip = 2;
  repeated int32 fromdatanodeport = 3;
  repeated string todatanodeip = 4;
  repeated int32 todatanodeport = 5;
  int32 block_size = 6;
}

message blockRelocReply {
  string result = 1;
}

message AskIfSuccess {
  int32 step = 1;
}

message RepIfSuccess {
  bool ifsuccess = 1;
}

// delete
message NodeAndBlock {
  repeated string blockkeys = 1;
  repeated string datanodeip = 2;
  repeated int32 datanodeport = 3;
  int32 stripe_id = 4;
  string key = 5;
}

message DelReply {
  bool ifcommit = 1;
}

// The request message containing the user's name.
message CheckaliveCMD {
  string name = 1;
}

// The response message containing the greetings
message RequestResult {
  bool message = 1;
}

// set and get
message ObjectAndPlacement{
  string key = 1;
  int32 valuesizebyte = 2;
  int32 k = 3;
  int32 l = 4;
  int32 g_m = 5;
  int32 stripe_id = 6;
  repeated string datanodeip = 7;
  repeated int32 datanodeport = 8;
  repeated string blockkeys = 9;
  repeated int32 blockids = 10;
  int32 block_size = 11;
  int32 encode_type = 12;
  string clientip = 13;
  int32 clientport = 14;
}

// degraded read
message DegradedReadRequest{
  string clientip = 1;
  int32 clientport = 2;
  int32 failed_block_id = 3;
  int32 failed_block_stripe_id = 4;
  string failed_block_key = 5;
  repeated string datanodeip = 6;
  repeated int32 datanodeport = 7;
  repeated string blockkeys = 8;
  repeated int32 blockids = 9;
  // multi-block global recovery: full k source block ids
  repeated int32 decode_block_ids = 10;
  // multi-block global recovery: block ids to repair this round
  repeated int32 failed_block_ids = 11;
  // If non-empty, all failed block ids for decode plan (must be a superset of failed_block_ids).
  // If empty, failed_block_ids is used as the full failure set (backward compatible).
  repeated int32 all_failed_block_ids = 12;
  // Maintenance-robust two-phase read: surviving DATA members of the leftover's local group.
  // A helper that holds >=1 of these blocks ALSO emits a 1-block "local fill" partial (XOR of
  // its held members) to the dest, in addition to its global-batch partial. Used so the dest can
  // do the in-memory local fill of the leftover block(s) without a separate read round.
  repeated int32 local_member_block_ids = 13;
  // When true, every partial sent to the dest is prefixed with an 8-byte header
  // [uint32 tag (0=global batch, 1=local fill)][uint32 nblocks] so the dest can route/route-size
  // connections that may interleave on its single acceptor.
  bool maintenance_header = 14;
}

message PartialDecodingRequest{
  string dest_ip = 1;
  int32 dest_port = 2;
  repeated int32 source_block_ids = 3;
  repeated string source_block_keys = 4;
  repeated string source_datanode_ips = 5;
  repeated int32 source_datanode_ports = 6;
  int32 decode_num = 7;
  repeated int32 decode_factors = 8;
}

message DegradedReadReply {
  double disk_io_start_time = 1;
  double disk_io_end_time = 2;
  double network_start_time = 3;
  double network_end_time = 4;
  double decode_start_time = 5;
  double decode_end_time = 6;
  double cross_rack_time = 7;
  double cross_rack_xor_time = 8;
  double grpc_start_time = 9;
  double data_node_grpc_notify_time = 10;
  double data_node_grpc_start_time = 11;
}

// recovery
message RecoveryRequest{
  string replaced_node_ip = 1;
  int32 replaced_node_port = 2;
  int32 failed_block_id = 3;
  string failed_block_key = 4;
  int32 cross_rack_num = 5;
  repeated string datanodeip = 6;
  repeated int32 datanodeport = 7;
  repeated string blockkeys = 8;
  repeated int32 blockids = 9;
  repeated string proxyip = 10;
  repeated int32 proxyport = 11;
  bool is_to_send_block_id = 12;
  int32 block_id_to_send = 13;
  // multi-block global recovery: full k source block ids
  repeated int32 decode_block_ids = 14;
  // multi-block global recovery: block ids to repair this round (>=1)
  repeated int32 failed_block_ids = 15;
  // per failed block write-back node (same order as failed_block_ids)
  repeated string replaced_node_ips = 16;
  repeated int32 replaced_node_ports = 17;
  // per failed block key for write-back (same order as failed_block_ids)
  repeated string failed_block_keys = 18;
  // If non-empty, all failed block ids for decode plan (must be a superset of failed_block_ids).
  // If empty, failed_block_ids is used as the full failure set (backward compatible).
  repeated int32 all_failed_block_ids = 19;
  // Maintenance-robust read: in the multi-block path, stream every reconstructed block back to
  // the client (one connection per block, prefixed with a uint32 block id) instead of writing it
  // back to a datanode. The client address is carried in replaced_node_ip / replaced_node_port.
  bool send_to_client = 20;
  // ---- Maintenance-robust two-phase read (dest side) ----
  // When maintenance_header is true, this RecoveryRequest drives the two-phase maintenance read:
  // (1) reconstruct the global-batch blocks (failed_block_ids, N-1/N-2) in memory from the
  //     tag=0 cross-rack partials, then
  // (2) in-memory local fill of the leftover block(s) using: the tag=1 local-fill partials
  //     (XOR of surviving local-group siblings), the directly-read local parity block(s), and the
  //     just-reconstructed global-batch members that belong to the leftover's local group.
  // Finally stream all (global-batch + leftover) blocks to the client (block-id prefixed).
  bool maintenance_header = 27;
  // leftover block id(s) to produce via in-memory local fill (1 for AzureLRC/OptimalLRC/UniformLRC,
  // 2 for LotusLRC).
  repeated int32 leftover_block_ids = 21;
  // local parity block id(s) of the leftover's local group; read directly by the dest (the only new
  // read of phase 2). For LotusLRC there are 2.
  repeated int32 local_parity_block_ids = 22;
  repeated string local_parity_datanodeip = 23;
  repeated int32 local_parity_datanodeport = 24;
  repeated string local_parity_blockkeys = 25;
  // The global-batch blocks (a subset of failed_block_ids) that belong to the leftover's local group;
  // their reconstructed values are XORed into the local-fill combine.
  repeated int32 reconstructed_lg_member_ids = 26;
  // number of tag=1 local-fill partial senders the dest should accept.
  int32 local_fill_sender_num = 28;
}

message MultipleRecoveryRequest{
  string replacing_node_ip = 1;
  int32 replacing_node_port = 2;
  repeated int32 failed_block_ids = 3;
  repeated string failed_block_keys = 4;
  int32 cross_rack_num = 5;
}

message RecoveryReply {
  double disk_io_start_time = 1;
  double disk_io_end_time = 2;
  double network_start_time = 3;
  double network_end_time = 4;
  double decode_start_time = 5;
  double decode_end_time = 6;
  double cross_rack_time = 7;
  double cross_rack_xor_time = 8;
  double grpc_start_time = 9;
  double data_node_grpc_notify_time = 10;
  double data_node_grpc_start_time = 11;
  double dest_data_node_network_time = 12;
  double dest_data_node_disk_io_time = 13;
  
}

// append
message AppendStripeDataPlacement{
  string key = 1;
  int32 cluster_id = 2;
  int32 stripe_id = 3;
  // sum of all append slices within the cluster
  uint64 append_size = 4;
  repeated string datanodeip = 5;
  repeated int32 datanodeport = 6;
  repeated string blockkeys = 7;
  repeated int32 blockids = 8;
  // physical offset of each append slice within each block
  repeated uint64 offsets = 9;
  repeated uint64 sizes = 10;
  bool is_merge_parity = 11;
  string append_mode = 12;
  bool is_serialized = 13;
}

message SetReply {
  bool ifcommit = 1;
}
message GetReply {
  bool getsuccess = 1;
}
message StripeAndBlockIDs{
  int32 stripe_id = 1;
  int32 group_id = 2;
  string clientip = 3;
  int32 clientport = 4;
  repeated int32 block_ids = 5;
  repeated string block_keys = 6;
  repeated string datanodeips = 7;
  repeated int32 datanodeports = 8;
}