# 全局集群配置：仅维护此文件即可驱动 clusterInformation.xml 生成与 run_all_remote.sh
# ip_mode:
#   port_simulated — 每个 cluster 占一个真实节点（proxy IP 递增），datanode 与该 proxy 同 IP、不同端口
#   distributed    — proxy 与每个 datanode 各占一个真实节点（需 cluster_num * (1 + datanode_per_cluster) 个 IP）
# 若 first_proxy_ip=127.0.0.1，则所有节点 IP 均为 127.0.0.1（仅端口区分）

[cluster]
cluster_num = 21
datanode_per_cluster = 6
first_proxy_ip = 10.10.1.3
first_proxy_port = 50405
datanode_port_start = 17600
coordinator_ip = 10.10.1.2
ip_mode = port_simulated

[ssh]
user = root
