# 全局集群配置：驱动 clusterInformation.xml 生成、run_all_remote.sh、limit_*.sh
# ip_mode=all_ips：从 all_ips 读入全部 IP，排序后自动分配 client/coordinator/proxy/datanode
# ip_mode=distributed：从 first_proxy_ip 起顺序递增（本地/仿真）

[cluster]
cluster_num = 17
datanode_per_cluster = 4
client_num = 1
# 显式指定 client 主机（留空则用排序后最小的 client_num 个）。第 1 个为 leader。
# 其余机器（去掉这些 client 后）排序：第 1 个为 coordinator，其余为集群。
client_ips = 172.16.0.1 
#172.16.0.3 
#172.16.0.4 172.16.0.5 
# 172.16.0.141 172.16.0.144 172.16.0.145 172.16.0.147
client_port_base = 44444
ip_mode = all_ips
all_ips_file = all_ips
first_proxy_ip = 172.16.0.11
first_proxy_port = 50405
datanode_port_start = 17600
coordinator_ip = 172.16.0.10
client_ip = 172.16.0.1

[ssh]
user = root
