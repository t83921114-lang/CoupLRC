# 全局集群配置：仅维护此文件即可驱动 clusterInformation.xml 生成与 run_all_remote.sh
# 若 first_proxy_ip=127.0.0.1，则所有节点 IP 均为 127.0.0.1（仅端口区分）
# first_proxy_ip 可为私网 IP（如 172.16.0.234）；从该地址起按 cluster_num / datanode_per_cluster
# 顺序递增末位分配 proxy 与 datanode（与 generate_xml_from_ini.py、limit_common.sh 一致）

[cluster]
cluster_num = 2
datanode_per_cluster = 1
first_proxy_ip = 172.16.0.234
first_proxy_port = 50405
datanode_port_start = 17600
coordinator_ip = 10.10.1.2   # 控制机/coordinator 的私网 IP

[ssh]
user = root