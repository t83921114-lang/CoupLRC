# 全局集群配置：驱动 clusterInformation.xml 生成、run_all_remote.sh、limit_*.sh
# ip_mode=hosts_list：proxy/datanode IP 按 node_hosts 文件顺序分配（适用于非连续私网 IP）
# ip_mode=distributed（默认）：从 first_proxy_ip 起顺序递增末位

[cluster]
cluster_num = 17
datanode_per_cluster = 4
ip_mode = hosts_list
node_hosts_file = node_hosts
first_proxy_ip = 172.16.0.4
first_proxy_port = 50405
datanode_port_start = 17600
coordinator_ip = 172.16.0.3
client_ip = 172.16.0.1

[ssh]
user = root
